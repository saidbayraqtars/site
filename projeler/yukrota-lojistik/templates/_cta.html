{{ define "cta" }}
<section class="cta">
  <div class="wrap cta-in reveal">
    <div>
      <h2>Taşınma tarihiniz belli mi?</h2>
      <p>Takvimimiz ay sonlarında hızlı doluyor. Tarihi paylaşın, aracı ve ekibi sizin için ayıralım.</p>
    </div>
    <div class="cta-btns">
      <a class="btn btn-d btn-lg" href="/iletisim/">Teklif formu</a>
      <a class="btn btn-ghost btn-lg" href="tel:{{ .Site.PhoneHref }}">{{ .Site.Phone }}</a>
    </div>
  </div>
</section>
{{ end }}
